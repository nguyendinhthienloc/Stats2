name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up XeLaTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Validate and run analysis
        run: |
          Rscript --vanilla scripts/ci_check.R
          Rscript --vanilla analysis/00_run_all.R

      - name: Build report and source bundle
        run: |
          Rscript --vanilla -e "renv::load(); rmarkdown::render('report/final-report.Rmd', output_file='final-report.pdf', quiet=FALSE)"
          mkdir -p dist
          cp report/final-report.pdf dist/STAT452_Group08_FinalReport.pdf
          zip -r dist/STAT452_Group08_ReproducibleSource.zip README.md TODO.md DESCRIPTION renv.lock Makefile R analysis scripts report/final-report.Rmd report/references.bib data/raw/source data/raw/wine_quality/winequality-red.csv
          if [ -f presentation/final-presentation.pdf ]; then cp presentation/final-presentation.pdf dist/STAT452_Group08_Presentation.pdf; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag --title "STAT452 Group 8 ${GITHUB_REF_NAME}"
