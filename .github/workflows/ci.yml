name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-analysis:
    name: Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Reproduce analysis
        run: Rscript --vanilla scripts/reproduce.R

  build-report:
    name: Report (MiKTeX)
    needs: validate-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install MiKTeX
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          curl -fsSL https://miktex.org/download/key | sudo gpg --dearmor -o /usr/share/keyrings/miktex.gpg
          echo "deb [signed-by=/usr/share/keyrings/miktex.gpg] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list
          sudo apt-get update
          sudo apt-get install -y miktex
          sudo miktexsetup --shared=yes finish
          sudo initexmf --admin --set-config-value='[MPM]AutoInstall=1'
          sudo initexmf --admin --update-fndb
          initexmf --set-config-value='[MPM]AutoInstall=1'
          initexmf --update-fndb
          sudo miktex packages update-package-database || true
          xelatex --version

      - name: Restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Reproduce analysis and report
        run: Rscript --vanilla scripts/reproduce.R --report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAT452-Group08-report
          path: report/final-report.pdf
          if-no-files-found: error
