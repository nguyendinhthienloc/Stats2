name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up XeLaTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Validate repository and data contract
        run: Rscript --vanilla scripts/ci_check.R

      - name: Run analysis pipeline
        run: Rscript --vanilla analysis/00_run_all.R

      - name: Render PDF report
        run: Rscript --vanilla -e "renv::load(); rmarkdown::render('report/final-report.Rmd', output_file='final-report.pdf', quiet=FALSE)"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: STAT452-Group08-report
          path: report/final-report.pdf
          if-no-files-found: error
